<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Calorie Counter
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'homepage' %}">
                Calorie Counter
            </a>


            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">


                    {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">
                            Dashboard
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile_view' %}">
                            Profile
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'calorie_calculation' %}">
                            Calculate
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_calorie' %}">
                            Add Calorie
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'change_pass' %}">
                            Change Password
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'user_logout' %}">
                            Logout
                        </a>
                    </li>

                    {% else %}

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'user_login' %}">
                            Login
                        </a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'user_register' %}">
                            Register
                        </a>
                    </li>

                    {% endif %}


                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="container py-4">

        {% block content %}

        {% endblock %}

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-3 mt-5">

        <div class="container">

            <small>
                © 2026 Calorie Counter |
                Developed with Django
            </small>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
