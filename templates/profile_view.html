{% extends 'base.html' %}

{% block title %}
Profile
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h3 class="mb-4">

                    {% if profile %}
                    Update Profile
                    {% else %}
                    Create Profile
                    {% endif %}

                </h3>


                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}


                    <button type="submit" class="btn btn-primary">

                        Save Profile

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
